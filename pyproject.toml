[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasound-dg"
version = "0.1.0"
description = "Domain generalization for robust breast ultrasound lesion segmentation across clinical domains."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "Aleksandra Ciesińska" }]

dependencies = [
    "albumentations>=2.0",
    "matplotlib>=3.9",
    "mlflow>=3.1.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "openpyxl>=3.1",
    "pandas>=2.3",
    "pillow>=12.3.0",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

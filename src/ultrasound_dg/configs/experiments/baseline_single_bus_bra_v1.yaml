name: baseline_single_bus_bra_v1

development:
  seed: 42

  source_domains:
    - bus_bra

  ood_development_domain:
    - bus_uclm

  final_test_domain:
    - breast_usg

  excluded_domains:
    - busi

  source_validation_fraction: 0.2

  splitting:
    bus_bra:
      strategy: patient
      stratify_by: diagnosis

preprocessing:
  version: v1
  target_size: 256

training:
  seed: 42
  device: auto
  train_batch_size: 16
  eval_batch_size: 16
  epochs: 40
  num_workers: 0
  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0
  decision_threshold: 0.5

name: baseline_multisource_domain_balanced_v1

development:
  seed: 42

  source_domains:
    - bus_bra
    - busi

  ood_development_domain:
    - bus_uclm

  final_test_domain:
    - breast_usg

  excluded_domains: []

  source_validation_fraction: 0.2

  splitting:
    bus_bra:
      strategy: patient
      stratify_by: diagnosis

    busi:
      strategy: sample
      stratify_by: diagnosis

preprocessing:
  version: v1
  target_size: 256

training:
  seed: 42
  device: auto
  train_batch_size: 16
  eval_batch_size: 16
  epochs: 40
  num_workers: 0
  learning_rate: 0.0001
  weight_decay: 0.0
  optimizer: AdamW
  decision_threshold: 0.5
  sampling_strategy: domain_balanced
  checkpoint_selection_tolerance: 0.01